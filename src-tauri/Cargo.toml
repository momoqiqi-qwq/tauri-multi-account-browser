[package]
name = "tauri-multi-account-browser"
version = "0.13.0"
description = "Tauri 2 multi-account browser shell"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "tauri_multi_account_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
tauri-plugin-dialog = "2.7.3"
csv = "1.4.0"

# v27：关闭 WebView2 浏览器加速键（Ctrl+T/W/L、F5 等），让按键能到达页面 JS，
# 再经 mbkey:// 假导航转发给宿主，快捷键才能在网页获得焦点时生效。
# 版本必须与 tauri-runtime-wry 依赖的 webview2-com 一致（见 Cargo.lock），
# 否则 COM 接口类型不统一。
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[features]
# 生产构建必须开启。没有它，tauri::is_dev() 为 true，应用会去连 devUrl
# （http://localhost:1420）而不是加载打包进来的前端 —— 表现为打开后白屏/连不上。
# `tauri build` 会自动带上它；用 cargo 直接构建时要手动 --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# 用于在单元测试里构造带 store 插件的 mock App，验证 schema 迁移行为。
tauri = { version = "2", features = ["unstable", "test"] }

[profile.release]
codegen-units = 1
lto = true
incremental = false
panic = "abort"
opt-level = "s"
strip = true

