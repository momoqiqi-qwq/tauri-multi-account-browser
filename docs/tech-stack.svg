<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1290" viewBox="0 0 1680 1290" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1680" height="1290" fill="#F7F8FA"/>

  <text x="60" y="88" font-size="40" font-weight="700" fill="#111827">Tauri 2 多账号浏览器 · 技术栈</text>
  <text x="60" y="126" font-size="17" fill="#6B7280">一个 Tauri 主窗口 + 多个原生 child WebView，每个标签页对应一个独立账号</text>
  <text x="60" y="154" font-size="14" fill="#9CA3AF">Windows / WebView2 &#183; v0.7.0 &#183; Rust 后端 9 个领域模块 &#183; 48 个单元测试</text>

  <!-- ============ 卡片 1 ============ -->
  <g transform="translate(60,190)">
    <rect width="500" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#E5484D"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">桌面外壳 &#183; Tauri 2</text>
    <rect x="418" y="29" width="56" height="26" rx="13" fill="#FDECEC"/>
    <text x="446" y="47" font-size="12" font-weight="600" fill="#E5484D" text-anchor="middle">核心</text>
    <line x1="26" y1="76" x2="474" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#E5484D">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">Tauri 2.x 原生外壳</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#E5484D">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">主窗口 + child WebView</text>
    <text x="26" y="196" font-size="13.5" font-weight="700" fill="#E5484D">&#10003;</text>
    <text x="46" y="196" font-size="13.5" fill="#374151">标签页即一个账号</text>
    <text x="258" y="136" font-size="13.5" font-weight="700" fill="#E5484D">&#10003;</text>
    <text x="278" y="136" font-size="13.5" fill="#374151">hide/show 保留页面状态</text>
    <text x="258" y="166" font-size="13.5" font-weight="700" fill="#E5484D">&#10003;</text>
    <text x="278" y="166" font-size="13.5" fill="#374151">WebView2 运行时</text>
    <text x="258" y="196" font-size="13.5" font-weight="700" fill="#E5484D">&#10003;</text>
    <text x="278" y="196" font-size="13.5" fill="#374151">IPC 走 invoke 命令</text>
    <rect x="26" y="216" width="448" height="112" rx="10" fill="#F9FAFB"/>
    <text x="44" y="242" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="44" y="272" font-size="13" fill="#4B5563">标签切换只做 hide/show，不销毁 WebView，</text>
    <text x="44" y="298" font-size="13" fill="#4B5563">页面状态、滚动位置与 JS 运行态都保留。</text>
  </g>

  <!-- ============ 卡片 2 ============ -->
  <g transform="translate(590,190)">
    <rect width="500" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#F59E0B"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">前端 &#183; Vue 3 生态</text>
    <rect x="418" y="29" width="56" height="26" rx="13" fill="#FEF3E2"/>
    <text x="446" y="47" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">界面</text>
    <line x1="26" y1="76" x2="474" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#F59E0B">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">Vue 3.5 组合式 API</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#F59E0B">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">TypeScript 5.9 类型</text>
    <text x="26" y="196" font-size="13.5" font-weight="700" fill="#F59E0B">&#10003;</text>
    <text x="46" y="196" font-size="13.5" fill="#374151">Vite 7 开发与构建</text>
    <text x="258" y="136" font-size="13.5" font-weight="700" fill="#F59E0B">&#10003;</text>
    <text x="278" y="136" font-size="13.5" fill="#374151">Element Plus 2.11</text>
    <text x="258" y="166" font-size="13.5" font-weight="700" fill="#F59E0B">&#10003;</text>
    <text x="278" y="166" font-size="13.5" fill="#374151">13 个 SFC 组件</text>
    <text x="258" y="196" font-size="13.5" font-weight="700" fill="#F59E0B">&#10003;</text>
    <text x="278" y="196" font-size="13.5" fill="#374151">3 个 composable</text>
    <rect x="26" y="216" width="448" height="112" rx="10" fill="#F9FAFB"/>
    <text x="44" y="242" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="44" y="272" font-size="13" fill="#4B5563">App.vue 拆成 useProfiles / useTabs /</text>
    <text x="44" y="298" font-size="13" fill="#4B5563">useSettings，组件只负责布局与编排。</text>
  </g>

  <!-- ============ 卡片 3 ============ -->
  <g transform="translate(1120,190)">
    <rect width="500" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#F97316"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">Rust 后端 &#183; 领域分层</text>
    <rect x="418" y="29" width="56" height="26" rx="13" fill="#FEEDE3"/>
    <text x="446" y="47" font-size="12" font-weight="600" fill="#EA580C" text-anchor="middle">架构</text>
    <line x1="26" y1="76" x2="474" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#F97316">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">lib.rs 拆 9 个模块</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#F97316">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">profiles 账号 CRUD</text>
    <text x="26" y="196" font-size="13.5" font-weight="700" fill="#F97316">&#10003;</text>
    <text x="46" y="196" font-size="13.5" fill="#374151">webviews 生命周期</text>
    <text x="258" y="136" font-size="13.5" font-weight="700" fill="#F97316">&#10003;</text>
    <text x="278" y="136" font-size="13.5" fill="#374151">downloads 下载账本</text>
    <text x="258" y="166" font-size="13.5" font-weight="700" fill="#F97316">&#10003;</text>
    <text x="278" y="166" font-size="13.5" fill="#374151">store / settings 持久化</text>
    <text x="258" y="196" font-size="13.5" font-weight="700" fill="#F97316">&#10003;</text>
    <text x="278" y="196" font-size="13.5" fill="#374151">validation 输入校验</text>
    <rect x="26" y="216" width="448" height="112" rx="10" fill="#F9FAFB"/>
    <text x="44" y="242" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="44" y="272" font-size="13" fill="#4B5563">原本 3000+ 行的单体 lib.rs 按领域拆开，</text>
    <text x="44" y="298" font-size="13" fill="#4B5563">每个模块只对自己的数据结构负责。</text>
  </g>

  <!-- ============ 卡片 4 ============ -->
  <g transform="translate(60,570)">
    <rect width="500" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#10B981"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">账号隔离 &#183; 多 Profile</text>
    <rect x="418" y="29" width="56" height="26" rx="13" fill="#E7F7F1"/>
    <text x="446" y="47" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">核心</text>
    <line x1="26" y1="76" x2="474" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#10B981">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">每账号独立数据目录</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#10B981">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">profiles/{profile_id}/</text>
    <text x="26" y="196" font-size="13.5" font-weight="700" fill="#10B981">&#10003;</text>
    <text x="46" y="196" font-size="13.5" fill="#374151">Cookie 天然隔离</text>
    <text x="258" y="136" font-size="13.5" font-weight="700" fill="#10B981">&#10003;</text>
    <text x="278" y="136" font-size="13.5" fill="#374151">不保存账号密码</text>
    <text x="258" y="166" font-size="13.5" font-weight="700" fill="#10B981">&#10003;</text>
    <text x="278" y="166" font-size="13.5" fill="#374151">只存账号元数据</text>
    <text x="258" y="196" font-size="13.5" font-weight="700" fill="#10B981">&#10003;</text>
    <text x="278" y="196" font-size="13.5" fill="#374151">隔离由 WebView2 保证</text>
    <rect x="26" y="216" width="448" height="112" rx="10" fill="#F9FAFB"/>
    <text x="44" y="242" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="44" y="272" font-size="13" fill="#4B5563">不靠应用层过滤 Cookie，而是直接给每个</text>
    <text x="44" y="298" font-size="13" fill="#4B5563">Profile 独立的 User Data Folder。</text>
  </g>

  <!-- ============ 卡片 5 ============ -->
  <g transform="translate(590,570)">
    <rect width="500" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#14B8A6"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">持久化 &#183; 数据层</text>
    <rect x="418" y="29" width="56" height="26" rx="13" fill="#E4F5F4"/>
    <text x="446" y="47" font-size="12" font-weight="600" fill="#0D9488" text-anchor="middle">数据</text>
    <line x1="26" y1="76" x2="474" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#14B8A6">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">tauri-plugin-store</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#14B8A6">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">schema_version 迁移</text>
    <text x="26" y="196" font-size="13.5" font-weight="700" fill="#14B8A6">&#10003;</text>
    <text x="46" y="196" font-size="13.5" fill="#374151">CSV 导入导出</text>
    <text x="258" y="136" font-size="13.5" font-weight="700" fill="#14B8A6">&#10003;</text>
    <text x="278" y="136" font-size="13.5" fill="#374151">冲突策略可选</text>
    <text x="258" y="166" font-size="13.5" font-weight="700" fill="#14B8A6">&#10003;</text>
    <text x="278" y="166" font-size="13.5" fill="#374151">逐行错误报告</text>
    <text x="258" y="196" font-size="13.5" font-weight="700" fill="#14B8A6">&#10003;</text>
    <text x="278" y="196" font-size="13.5" fill="#374151">已下载文件去重</text>
    <rect x="26" y="216" width="448" height="112" rx="10" fill="#F9FAFB"/>
    <text x="44" y="242" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="44" y="272" font-size="13" fill="#4B5563">schema 变更必须写显式迁移分支，</text>
    <text x="44" y="298" font-size="13" fill="#4B5563">拒绝隐式结构漂移损坏老数据。</text>
  </g>

  <!-- ============ 卡片 6 ============ -->
  <g transform="translate(1120,570)">
    <rect width="500" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#3B82F6"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">构建 &#183; 发布链路</text>
    <rect x="418" y="29" width="56" height="26" rx="13" fill="#E8F0FE"/>
    <text x="446" y="47" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">工程</text>
    <line x1="26" y1="76" x2="474" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#3B82F6">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">Vite 7 前端产物</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#3B82F6">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">Cargo + MSVC 链接</text>
    <text x="26" y="196" font-size="13.5" font-weight="700" fill="#3B82F6">&#10003;</text>
    <text x="46" y="196" font-size="13.5" fill="#374151">custom-protocol 特性</text>
    <text x="258" y="136" font-size="13.5" font-weight="700" fill="#3B82F6">&#10003;</text>
    <text x="278" y="136" font-size="13.5" fill="#374151">verify:assets 校验</text>
    <text x="258" y="166" font-size="13.5" font-weight="700" fill="#3B82F6">&#10003;</text>
    <text x="278" y="166" font-size="13.5" fill="#374151">便携单文件 exe</text>
    <text x="258" y="196" font-size="13.5" font-weight="700" fill="#3B82F6">&#10003;</text>
    <text x="278" y="196" font-size="13.5" fill="#374151">LTO + strip 瘦身</text>
    <rect x="26" y="216" width="448" height="112" rx="10" fill="#F9FAFB"/>
    <text x="44" y="242" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="44" y="272" font-size="13" fill="#4B5563">漏开 custom-protocol 会白屏 —— 应用会</text>
    <text x="44" y="298" font-size="13" fill="#4B5563">去连 devUrl，而不是加载内嵌前端产物。</text>
  </g>

  <!-- ============ 卡片 7（宽卡） ============ -->
  <g transform="translate(60,950)">
    <rect width="1560" height="260" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#cardShadow)"/>
    <circle cx="42" cy="42" r="15" fill="#8B5CF6"/>
    <text x="42" y="47" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="68" y="49" font-size="19" font-weight="700" fill="#111827">工程质量 &#183; 可维护性</text>
    <rect x="1478" y="29" width="56" height="26" rx="13" fill="#F1EBFE"/>
    <text x="1506" y="47" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">质量</text>
    <line x1="26" y1="76" x2="1534" y2="76" stroke="#F1F2F4"/>
    <text x="26" y="104" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">技术栈</text>
    <text x="26" y="136" font-size="13.5" font-weight="700" fill="#8B5CF6">&#10003;</text>
    <text x="46" y="136" font-size="13.5" fill="#374151">48 个 Rust 单元测试</text>
    <text x="26" y="166" font-size="13.5" font-weight="700" fill="#8B5CF6">&#10003;</text>
    <text x="46" y="166" font-size="13.5" fill="#374151">mock App 验证 schema 迁移</text>
    <text x="540" y="136" font-size="13.5" font-weight="700" fill="#8B5CF6">&#10003;</text>
    <text x="560" y="136" font-size="13.5" fill="#374151">clippy 零警告</text>
    <text x="540" y="166" font-size="13.5" font-weight="700" fill="#8B5CF6">&#10003;</text>
    <text x="560" y="166" font-size="13.5" fill="#374151">发布构建嵌入资源校验</text>
    <text x="1054" y="136" font-size="13.5" font-weight="700" fill="#8B5CF6">&#10003;</text>
    <text x="1074" y="136" font-size="13.5" fill="#374151">9 个 Rust 领域模块</text>
    <text x="1054" y="166" font-size="13.5" font-weight="700" fill="#8B5CF6">&#10003;</text>
    <text x="1074" y="166" font-size="13.5" fill="#374151">13 个 SFC + 3 个 composable</text>
    <rect x="26" y="196" width="1508" height="46" rx="8" fill="#F9FAFB"/>
    <text x="44" y="224" font-size="12.5" font-weight="700" fill="#9CA3AF" letter-spacing="1">关键取舍</text>
    <text x="130" y="224" font-size="13" fill="#4B5563">先补测试再改逻辑 —— answer_finished_at 的下降沿判定就是靠单元测试锁住的。</text>
  </g>

  <text x="60" y="1256" font-size="13" fill="#9CA3AF">本图依据 package.json 与 Cargo.toml 的实际依赖绘制，不含未采用的技术</text>
</svg>
